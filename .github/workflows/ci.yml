name: ci

# kovyr-edr is public: anyone's pull request, from any fork, runs this
# workflow. So nothing a pull request run makes may look official: only
# publish-test-kit, on main, uploads the test kit.

on:
  push:
    branches: ["**"]
  pull_request:
  # "Run workflow" on the Actions page. On main it also publishes a test kit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Use the Go that setup-go installs from go.mod; never auto-download
      # another toolchain.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6

      # Installs exactly the version on go.mod's go line.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Build Windows binaries
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o dist/ ./cmd/kovyr-agent ./cmd/kovyr-receiver-dev

      - name: Real Windows checks, power and load, folder watcher, DPAPI key store (integration)
        if: runner.os == 'Windows'
        run: go test -count=1 -v -run "TestRealWindowsChecks|TestRealWindowsConditions|TestRealWatcher|TestUserFoldersAndEngines|TestDPAPI|TestKeyFileHoldsNoPlainKey|TestGenerateLoadRoundTrip" ./internal/checks/ ./internal/sysload/ ./internal/tripwire/ ./internal/keystore/

      - name: kovyr-agent check on this runner
        if: runner.os == 'Windows'
        shell: bash
        run: ./dist/kovyr-agent.exe check --state-dir "$RUNNER_TEMP/kovyr-state"

      # CLAUDE.md: under 1% CPU on average and under 50 MB RAM. Measures a
      # run --once loop and the running loop on this runner; fails over
      # budget. The numbers go to the job summary.
      - name: Resource budget
        if: runner.os == 'Windows'
        run: go run ./internal/tools/winci budget --agent dist/kovyr-agent.exe --receiver dist/kovyr-receiver-dev.exe

      # The ransomware tripwire end to end: the agent watches a temporary
      # folder of dummy files this step creates; light edits must not trip
      # it; renaming them all to a new extension must send an extra
      # heartbeat that the dev receiver shows as ransomware_suspected.
      # Nothing outside that folder is touched.
      - name: Ransomware tripwire
        if: runner.os == 'Windows'
        run: go run ./internal/tools/winci tripwire --agent dist/kovyr-agent.exe --receiver dist/kovyr-receiver-dev.exe

      # The real service on this (elevated) runner, against the dev
      # receiver on loopback: install, status, start, heartbeats, stop,
      # crash recovery, uninstall.
      - name: Windows service lifecycle
        if: runner.os == 'Windows'
        run: go run ./internal/tools/winci service --agent dist/kovyr-agent.exe --receiver dist/kovyr-receiver-dev.exe

      - name: Service log (on failure)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: Get-Content -ErrorAction SilentlyContinue "$env:ProgramData\Kovyr\logs\agent.log"

  # The installer. It is built on Linux with wixl (msitools), then a fresh
  # windows-latest runner installs it silently, checks the service, runs
  # the founder's test scripts against it, and uninstalls it. The ci-only
  # artifacts only carry the MSI between these jobs, for a day. The test
  # kit that docs/testing-on-your-pc.md downloads is published by
  # publish-test-kit, from main only.
  installer-build:
    name: installer (build the MSI on Linux)
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install wixl (msitools)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends wixl msitools

      - name: Build the MSI
        run: installer/build-msi.sh dist/installer

      # Not shipped: the x64 MSI also runs on Windows on ARM, under
      # emulation. This only keeps the code building for arm64; nothing
      # tests an arm64 binary.
      - name: windows/arm64 builds (untested, not shipped)
        env:
          GOOS: windows
          GOARCH: arm64
        run: go vet ./... && go build -o /dev/null ./cmd/kovyr-agent

      - name: Assemble the test kit
        run: |
          mkdir -p dist/kit
          cp dist/installer/kovyr-protection-alarm-x64.msi dist/installer/SHA256SUMS dist/kit/
          cp scripts/test/*.ps1 docs/testing-on-your-pc.md dist/kit/
          ls -l dist/kit

      - uses: actions/upload-artifact@v6
        with:
          name: ci-only-kit-do-not-install
          path: dist/kit/
          if-no-files-found: error
          retention-days: 1

      # A second build of the same MSI gets a new product code, like each
      # new test kit; the Windows job installs it over the first. CI only.
      - name: Build the MSI again (for the upgrade test)
        run: installer/build-msi.sh dist/rebuild

      - uses: actions/upload-artifact@v6
        with:
          name: ci-only-rebuild-do-not-install
          path: dist/rebuild/kovyr-protection-alarm-x64.msi
          if-no-files-found: error
          retention-days: 1

  installer-test:
    name: installer (install the MSI on windows-latest)
    needs: installer-build
    runs-on: windows-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v7
        with:
          name: ci-only-kit-do-not-install
          path: kit

      - uses: actions/download-artifact@v7
        with:
          name: ci-only-rebuild-do-not-install
          path: rebuild

      - name: Build the dev receiver and the plain agent
        shell: bash
        run: go build -o dist/ ./cmd/kovyr-agent ./cmd/kovyr-receiver-dev

      # Silent install with SERVER pointing at the dev receiver on
      # loopback, the test kit's scripts, an upgrade, uninstall (key kept),
      # reinstall (same device), uninstall, and a refusal to install over
      # a service set up by hand.
      - name: MSI install, test kit, upgrade, uninstall
        run: go run ./internal/tools/winci msi --msi kit/kovyr-protection-alarm-x64.msi --upgrade-msi rebuild/kovyr-protection-alarm-x64.msi --kit kit --agent dist/kovyr-agent.exe --receiver dist/kovyr-receiver-dev.exe

      - name: Agent log (on failure)
        if: failure()
        shell: pwsh
        run: Get-Content -ErrorAction SilentlyContinue "$env:ProgramData\Kovyr\logs\agent.log"

  # The test kit docs/testing-on-your-pc.md downloads: the MSI and scripts
  # the jobs above built and tested, published only for a push to main or
  # a manual run on main, and only when every job passed. A pull request
  # run (from a fork or not) never publishes one.
  publish-test-kit:
    name: publish the test kit (main only)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test, installer-build, installer-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ci-only-kit-do-not-install
          path: kit

      - uses: actions/upload-artifact@v6
        with:
          name: kovyr-protection-alarm-test-kit
          path: kit/
          if-no-files-found: error
